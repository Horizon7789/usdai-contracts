name: Redemption invariant PoC

on:
  push:
    branches:
      - redemption-invariant-poc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redemption-invariant:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Must point to an Arbitrum archive RPC: the regression suite forks historical blocks.
      ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_ARCHIVE_RPC_URL }}
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Validate archive RPC configuration
        run: |
          if [ -z "$ARBITRUM_RPC_URL" ]; then
            echo "::error::Configure the ARBITRUM_ARCHIVE_RPC_URL repository secret with an Arbitrum archive RPC endpoint."
            exit 1
          fi

      - name: Run expanded stateful fuzz campaign
        run: |
          forge test \\
            --match-path test/stakedUsdai/RedemptionLogicInvariant.t.sol \\
            --fuzz-runs 1000 \\
            -vvv

      - name: Run existing StakedUSDai regression tests
        run: |
          forge test \\
            --match-path 'test/stakedUsdai/*.t.sol' \\
            -vv
