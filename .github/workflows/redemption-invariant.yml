name: Redemption invariant PoC

on:
  push:
    branches:
      - redemption-invariant-poc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redemption-invariant:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Public Arbitrum RPC; historical fork calls may require an archive-capable endpoint.
      ARBITRUM_RPC_URL: https://arb1.arbitrum.io/rpc
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run expanded stateful fuzz campaign
        run: |
          forge test \
            --match-path test/stakedUsdai/RedemptionLogicInvariant.t.sol \
            --fuzz-runs 1000 \
            -vvv

      - name: Run existing StakedUSDai regression tests
        run: |
          forge test \
            --match-path 'test/stakedUsdai/*.t.sol' \
            -vv
